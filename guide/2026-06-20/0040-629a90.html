<script type="text/markdown" id="md-intro">
# mdsite 是什么

mdsite 把一段 **Markdown / 对话内容**一键变成**云端可分享的精美 HTML 页面**，部署到**你自己的 GitHub Pages**。

> 这个页面本身就是 mdsite 能力的展示：一个**单文件自包含、带前端路由的 SPA**，由 `mdsite publish guide.html` 直接发布。

## 核心理念

- **工具，不是平台**：内容只部署到你自己的 GitHub，维护者不托管、不聚合任何内容。
- **零基建**：不用搭服务器、不用配 CI——push 到 GitHub Pages 即自动上线。
- **产物自包含**：一个 `.html`，依赖走公网 CDN，天生好分享、好归档。

## 两种产物

| 类型 | 怎么来 | 适合 |
|---|---|---|
| 单页报告 | `mdsite publish x.md` | 周报、分析、复盘 |
| 复杂 SPA | `mdsite publish x.html`（直通） | 教程、手册、多视图文档（就像本页） |
</script>

<script type="text/markdown" id="md-install">
# 安装

npm 包名 `@tomczhang/mdsite`，命令是 `mdsite`。

```bash
npm i -g @tomczhang/mdsite
mdsite --help
```

## 认证（一次即可）

**不需要 SSH key，也不需要配 GitHub Action。** 推荐最小权限，从高到低：

1. `gh auth login`（首选，token 不落任何文件）
2. fine-grained PAT，只授权那一个 pages 仓库（Contents + Pages + Administration: write）
3. classic `repo` PAT（兜底，注意它授予全部仓库读写）

> [!NOTE]
> token 绝不会写进 `.git/config` 或日志——只在推送时经子进程环境临时注入。
</script>

<script type="text/markdown" id="md-init">
# 初始化

```bash
mdsite init                      # 默认在 <你>/pages 建/复用仓库
mdsite init --repo <你>/my-pages # 指定仓库
```

`init` 会：

1. 在**你自己的** GitHub 建或复用目标仓库；
2. 开启该仓库的 GitHub Pages（来源 = `gh-pages` 分支根）；
3. 在本地准备工作区 `~/.mdsite`（即 gh-pages 分支工作树）；
4. 铺好站点首页。

> [!TIP]
> 仅对**本次新建**的仓库才会把默认分支切到 `gh-pages` 并删掉空 `main`；复用已有仓库时绝不动你的分支。
</script>

<script type="text/markdown" id="md-publish">
# 发布报告

```bash
mdsite publish notes.md --title "周报" --category report --summary "本周进展"
```

输出一个真实链接：`https://<你>.github.io/<repo>/report/<日期>/<slug>.html`。

- 输入 `.md` → 自动转 HTML 正文；输入 `.html` → 直通（适合本页这种富交互页面）。
- `--category` 任意 kebab-case（report / spec / review / dashboard / changelog…）。
- 站点根是你所有报告的**时间轴首页**，超 30 天自动折叠。

> [!IMPORTANT]
> 发布前会校验本地 git origin 与配置仓库一致、且不会覆盖非 mdsite 管理的已有站点（需 `--force`）。
</script>

<script type="text/markdown" id="md-authoring">
# 写出好看的报告

报告**总是以「摘要 + 速览」开头**，正文按语义分块。

## 摘要

用 `--summary` 传一句话核心结论，会渲染成顶部蓝色重点块。

## 速览（要点卡）

正文第一块用要点卡网格（Markdown 里可内嵌 HTML，**前后留空行**）：

```html
<div class="ql-grid">
  <div class="ql-card"><div class="ql-card-title">要点一</div><div class="ql-card-body">说明</div></div>
</div>
```

## 自动大纲

正文用 `##` / `###` 分节，页面会**自动生成右侧大纲**并随滚动高亮。
</script>

<script type="text/markdown" id="md-callouts">
# 语义提示块

按语义定色，用 GitHub 风格（每个独立成段、前后空行）：

> [!NOTE]
> 蓝色 · 说明性补充。

> [!TIP]
> 绿色 · 建议或技巧。

> [!IMPORTANT]
> 紫色 · 关键信息。

> [!WARNING]
> 黄色 · 需要注意的坑。

> [!CAUTION]
> 红色 · 高风险/警告。

可用：`[!NOTE]` `[!TIP]` `[!IMPORTANT]` `[!WARNING]` `[!CAUTION]`。
</script>

<script type="text/markdown" id="md-tables">
# 表格与徽章

技术报告多用表格，表头/斑马纹自带。单元格里可放**徽章**和行内代码：

| 事件 | 类型 | 说明 |
|---|---|---|
| trackExp | <span class="badge badge-green">EXP</span> | `instance_id`、`position` |
| trackClick | <span class="badge badge-blue">CLK</span> | 点击上报 |
| legacy | <span class="badge badge-gray">DEPRECATED</span> | 已废弃 |

徽章颜色：`badge-green` / `badge-blue` / `badge-gray` / `badge-amber`。

> [!NOTE]
> 本教程页用的是运行时 marked 渲染；徽章样式由报告模板提供，单页报告里同样可用。
</script>

<script type="text/markdown" id="md-deploy">
# 部署与多设备

## gh-pages 分支根

GitHub Pages 分支部署只伺服仓库根或 `/docs`。mdsite 让 `~/.mdsite` 工作区根 = gh-pages 分支根，push 即上线，零 CI。

## 多设备安全合并

多台机器并发发布时，索引 `pages.json` 在 rebase 冲突时做**语义合并**——两边新条目都保留、按时间去重排序，不丢任何报告。

```bash
# 第二台机器：init 会 clone 已有站点，publish 自动同步合并
mdsite init --repo <你>/pages
mdsite publish today.md --title ... --category ... --summary ...
```
</script>

<script type="text/markdown" id="md-privacy">
# 去中心与隐私

**你的内容只属于你。**

- 所有页面只部署到**你自己配置的 GitHub 仓库**，用**你自己的凭证**，由**你自己的 GitHub Pages** 服务。
- 工具**不向任何维护者后端发请求**，维护者不托管、不缓存、不聚合任何内容。
- 站点首页只列**你本人**的报告，**不存在**任何跨用户汇总入口或中心服务。

> [!IMPORTANT]
> 这条是产品的法律地基：mdsite 是「工具作者」立场（类似 Hugo / Jekyll），不是「平台方」。
</script>

<script type="text/markdown" id="md-faq">
# FAQ

### 命令叫 mdsite，包名却是 @tomczhang/mdsite？

npm 上无前缀的 `mdsite` 与既有包重名占不到，所以包名加了 scope；安装后命令仍是 `mdsite`。

### 能放图表 / 复杂交互吗？

能。写成自包含 `.html`（像本页用了 marked + highlight.js + 前端路由），用 `mdsite publish x.html` 直通发布即可。

### 报告能改样式吗？

能。`mdsite template eject report` 把内置模板拷到 `~/.mdsite/templates/` 后随意改，用户层覆盖内置层。
</script>

<!-- ===== 路由 + 渲染 ===== -->
<script>
  const NAV = [
    { group: '开始', items: [
      { id: 'intro', title: 'mdsite 是什么' },
      { id: 'install', title: '安装' },
      { id: 'init', title: '初始化' },
      { id: 'publish', title: '发布报告' },
    ]},
    { group: '写好报告', items: [
      { id: 'authoring', title: '结构：摘要+速览' },
      { id: 'callouts', title: '语义提示块' },
      { id: 'tables', title: '表格与徽章' },
    ]},
    { group: '机制', items: [
      { id: 'deploy', title: '部署与多设备' },
      { id: 'privacy', title: '去中心与隐私' },
      { id: 'faq', title: 'FAQ' },
    ]},
  ];
  const ORDER = NAV.flatMap(g => g.items);

  // 客户端语义提示块转换（与 mdsite 服务端 markdown.mjs 同款规则）
  const ALERTS = { NOTE:['note','说明','ℹ️'], TIP:['tip','提示','💡'], IMPORTANT:['important','重点','🔆'], WARNING:['warning','注意','⚠️'], CAUTION:['caution','警告','⛔'] };
  function transformAlerts(html) {
    return String(html).replace(/<blockquote>([\s\S]*?)<\/blockquote>/g, (full, inner) => {
      const m = inner.match(/^\s*<p>\s*\[!(\w+)\]\s*(?:<br\s*\/?>|\n)?/i);
      if (!m || !ALERTS[m[1].toUpperCase()]) return full;
      const [cls, label, icon] = ALERTS[m[1].toUpperCase()];
      let body = inner.replace(/^\s*<p>\s*\[![^\]]+\]\s*(?:<br\s*\/?>|\n)?/i, '<p>').replace(/^\s*<p>\s*<\/p>\s*/i, '');
      return `<div class="callout callout-${cls}"><div class="callout-title"><span>${icon}</span>${label}</div><div class="callout-body">${body}</div></div>`;
    });
  }

  function app() {
    return {
      open: false,
      init() {
        this.buildNav();
        // marked + highlight 集成
        if (window.markedHighlight) {
          marked.use(window.markedHighlight.markedHighlight({
            highlight(code, lang) {
              try { return hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang }).value : hljs.highlightAuto(code).value; }
              catch { return code; }
            }
          }));
        }
        window.addEventListener('hashchange', () => this.render());
        this.render();
      },
      buildNav() {
        const nav = document.getElementById('nav');
        NAV.forEach(g => {
          const h = document.createElement('div'); h.className = 'nav-group'; h.textContent = g.group; nav.appendChild(h);
          g.items.forEach(it => {
            const a = document.createElement('a'); a.className = 'nav-link'; a.dataset.id = it.id;
            a.href = '#/' + it.id; a.textContent = it.title; nav.appendChild(a);
          });
        });
      },
      currentId() {
        const id = (location.hash.replace(/^#\/?/, '') || ORDER[0].id);
        return ORDER.some(o => o.id === id) ? id : ORDER[0].id;
      },
      render() {
        const id = this.currentId();
        const src = document.getElementById('md-' + id);
        const html = src ? transformAlerts(marked.parse(src.textContent.trim())) : '<p>未找到该章节。</p>';
        const content = document.getElementById('content');
        content.innerHTML = html;
        content.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch {} });
        document.querySelectorAll('#nav .nav-link').forEach(a => a.classList.toggle('active', a.dataset.id === id));
        // 上一页/下一页
        const i = ORDER.findIndex(o => o.id === id);
        const prev = document.getElementById('prev'), next = document.getElementById('next');
        prev.textContent = i > 0 ? '← ' + ORDER[i - 1].title : '';
        prev.onclick = i > 0 ? () => location.hash = '#/' + ORDER[i - 1].id : null;
        next.textContent = i < ORDER.length - 1 ? ORDER[i + 1].title + ' →' : '';
        next.onclick = i < ORDER.length - 1 ? () => location.hash = '#/' + ORDER[i + 1].id : null;
        document.querySelector('main').scrollTo?.(0, 0);
        window.scrollTo(0, 0);
        this.open = false;
      },
    };
  }
</script>
