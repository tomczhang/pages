<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dashboard 模板示例：数据看板</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f172a%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M18%2010h21l9%209v35H18z%22%20fill%3D%22%23f8fafc%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M39%2010v10h9%22%20fill%3D%22%23dbeafe%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M22%2027h17M22%2034h13%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M43%2042c4%200%207-2.5%207-6.1%200-3-2.1-5.3-5-5.8A8%208%200%200%200%2030.6%2033%206.5%206.5%200%200%200%2032%2046h11z%22%20fill%3D%22%2338bdf8%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M39%2047V34m0%200-5%205m5-5%205%205%22%20stroke%3D%22%230f172a%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; color:#1f2329; }
    /* KPI 数字卡 */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1.2rem 0}
    .kpi-card{background:#fff;border:1px solid #eef0f2;border-radius:12px;padding:1.1rem 1.25rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .kpi-label{font-size:.82rem;color:#86909c;margin-bottom:.35rem}
    .kpi-value{font-size:1.9rem;font-weight:700;color:#1f2329;line-height:1.1}
    .kpi-delta{font-size:.8rem;margin-top:.4rem;font-weight:600}
    .kpi-delta.up{color:#009a29}.kpi-delta.down{color:#cb2634}.kpi-delta.flat{color:#86909c}
    /* 图表卡 */
    .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.2rem;margin:1.2rem 0}
    .chart-card{background:#fff;border:1px solid #eef0f2;border-radius:12px;padding:1rem 1.1rem}
    .chart-card h3{font-size:.95rem;font-weight:600;color:#1f2329;margin-bottom:.6rem}
    .chart{width:100%;height:300px}
    /* 正文（说明文字/表格） */
    .prose-mdsite{font-size:15px;line-height:1.8;color:#4e5969}
    .prose-mdsite h2{font-size:1.25rem;font-weight:600;color:#1f2329;margin:1.8rem 0 .8rem}
    .prose-mdsite table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.9rem;background:#fff}
    .prose-mdsite th,.prose-mdsite td{border:1px solid #e5e6eb;padding:.5rem .8rem;text-align:left}
    .prose-mdsite th{background:#f7f8fa;font-weight:600}.prose-mdsite tr:nth-child(even) td{background:#fafbfc}
    .prose-mdsite code{background:#f2f3f5;color:#d4380d;padding:.1rem .35rem;border-radius:4px;font-size:.88em}
    .prose-mdsite ul{list-style:disc;padding-left:1.5rem;margin:.7rem 0}.prose-mdsite li{margin:.3rem 0}
    .badge{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600}
    .badge-green{background:#e8f9ee;color:#009a29}.badge-blue{background:#eaf2ff;color:#1677ff}.badge-gray{background:#f2f3f5;color:#6b7280}.badge-amber{background:#fff3e0;color:#d97500}
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <a href="../../index.html" class="text-sm text-gray-400 hover:text-blue-600">&larr; 返回首页</a>
      <span class="text-xs text-gray-400">2026-06-20</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div class="mb-6">
      <p class="text-xs uppercase tracking-widest text-blue-600 font-semibold mb-1">dashboard</p>
      <h1 class="text-2xl font-bold text-gray-900">dashboard 模板示例：数据看板</h1>
      <p class="mt-2 text-gray-500">KPI 数字卡 + echarts 折线/饼图,声明式 data-echarts 自动渲染。</p>
    </div>

    <!-- 看板正文：KPI 卡 / 图表 / 表格由内容提供 -->
    <article id="article" class="prose-mdsite">
      <div class="kpi-grid">
  <div class="kpi-card"><div class="kpi-label">日活 DAU</div><div class="kpi-value">12,345</div><div class="kpi-delta up">+5.2% 周环比</div></div>
  <div class="kpi-card"><div class="kpi-label">转化率</div><div class="kpi-value">3.8%</div><div class="kpi-delta down">-0.4pt</div></div>
  <div class="kpi-card"><div class="kpi-label">GMV</div><div class="kpi-value">¥86.2万</div><div class="kpi-delta up">+12%</div></div>
  <div class="kpi-card"><div class="kpi-label">退款率</div><div class="kpi-value">1.2%</div><div class="kpi-delta flat">持平</div></div>
</div>

<div class="chart-grid">
  <div class="chart-card"><h3>近 7 日 DAU 趋势</h3>
    <div class="chart" data-echarts='{"tooltip":{},"xAxis":{"type":"category","data":["一","二","三","四","五","六","日"]},"yAxis":{"type":"value"},"series":[{"type":"line","smooth":true,"areaStyle":{},"data":[10200,10800,11500,11200,12000,12800,12345]}]}'></div>
  </div>
  <div class="chart-card"><h3>渠道占比</h3>
    <div class="chart" data-echarts='{"tooltip":{},"series":[{"type":"pie","radius":["40%","70%"],"data":[{"value":48,"name":"自然"},{"value":30,"name":"投放"},{"value":22,"name":"私域"}]}]}'></div>
  </div>
</div>

<h2>说明</h2>
<p>看板模板:KPI 数字卡 + echarts 图表(声明式 <code>data-echarts</code>),正文也能放表格/列表。</p>

    </article>

    <footer class="mt-12 pt-6 border-t border-gray-100 text-sm text-gray-400">
      由 <span class="font-medium text-gray-500">Pages</span> 生成 · 2026-06-20
    </footer>
  </main>

  <script>
    // 声明式图表：<div class="chart" data-echarts='{...echarts option JSON...}'></div> 自动渲染
    (function () {
      if (typeof echarts === 'undefined') return;
      const charts = [];
      document.querySelectorAll('.chart[data-echarts]').forEach((el) => {
        try {
          const opt = JSON.parse(el.getAttribute('data-echarts'));
          const c = echarts.init(el);
          c.setOption(opt);
          charts.push(c);
        } catch (e) { el.innerHTML = '<p style="color:#cb2634;font-size:13px">图表配置解析失败</p>'; }
      });
      window.addEventListener('resize', () => charts.forEach((c) => c.resize()));
    })();
  </script>
</body>
</html>
